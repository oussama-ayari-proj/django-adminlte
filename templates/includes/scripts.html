{% load static %}
<!-- jQuery -->
<script src="{% static 'plugins/jquery/jquery.min.js' %}"></script>
<!-- Bootstrap 4 -->
<script src="{% static 'plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
<!-- overlayScrollbars -->
<script src="{% static 'plugins/overlayScrollbars/js/jquery.overlayScrollbars.min.js' %}"></script>
<!-- AdminLTE App -->
<script src="{% static 'dist/js/adminlte.min.js' %}"></script>

<script>
  $(document).ready(function() {
    // Initialiser le défilement personnalisé de la barre latérale
    if (typeof $.fn.overlayScrollbars !== 'undefined') {
      $('.sidebar').overlayScrollbars({
        scrollbars: {
          autoHide: "leave",
          autoHideDelay: 200
        }
      });
    }
    
    // Restaurer le comportement de survol
    $('.main-sidebar').hover(
      function() {
        // Au survol, ajouter une classe temporaire
        if ($('body').hasClass('sidebar-collapse')) {
          $(this).addClass('sidebar-focused');
        }
      },
      function() {
        // À la sortie du survol, retirer la classe
        $(this).removeClass('sidebar-focused');
      }
    );
  });
</script>
