
services:
  optisoin-app:
    image: oussamaayari2020/optisoin-app:2.3.2
    container_name: optisoin
    restart: always
    ports: 
      - "8000:8000"
    depends_on:
      - mysql
    networks:
      - app_network
  mlflow:
    image: oussamaayari2020/mlflow-deployment:1.0.0
    container_name: mlflow
    restart: always
    ports:
      - "5000:5000"
    networks:
      - app_network
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network
volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge

